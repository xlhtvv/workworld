[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workworld"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.35,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "jsonschema[format]>=4.23,<5",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "python-magic>=0.4.27,<1",
  "python-multipart>=0.0.17,<1",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/workworld_api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src", "apps/worker/src"]
testpaths = ["apps/api/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
