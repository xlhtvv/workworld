name: workworld
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workworld
      POSTGRES_USER: workworld
      POSTGRES_PASSWORD: workworld
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workworld"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["redis-data:/data"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: workworld
      MINIO_ROOT_PASSWORD: change-me
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["minio-data:/data"]
  clamav:
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes: ["clamav-data:/var/lib/clamav"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      PUSH_ALLOWED_PRIVATE_HOSTS: ${PUSH_ALLOWED_PRIVATE_HOSTS:-[]}
      PUSH_CA_FILE: ${PUSH_CA_FILE:-}
    volumes:
      - ${WORKWORLD_PUSH_CERT_DIR:-/tmp/workworld-empty-push-certs}:/push-certs:ro
    ports: ["8000:8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 30
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      clamav: {condition: service_healthy}
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      WORKWORLD_WORKER_HEALTH_PATH: /tmp/workworld-worker-health
      PUSH_ALLOWED_PRIVATE_HOSTS: ${PUSH_ALLOWED_PRIVATE_HOSTS:-[]}
      PUSH_CA_FILE: ${PUSH_CA_FILE:-}
    volumes:
      - ${WORKWORLD_PUSH_CERT_DIR:-/tmp/workworld-empty-push-certs}:/push-certs:ro
    cpus: "1.0"
    mem_limit: 768m
    pids_limit: 256
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,time; p=os.environ['WORKWORLD_WORKER_HEALTH_PATH']; assert time.time()-os.stat(p).st_mtime < 30",
        ]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 6
    depends_on:
      api: {condition: service_healthy}
  web:
    build:
      context: apps/web
      args:
        COREPACK_NPM_REGISTRY: ${COREPACK_NPM_REGISTRY:-https://registry.npmjs.org}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
  push-agent:
    profiles: ["acceptance"]
    build:
      context: .
      dockerfile: examples/typescript-push-json-agent/Dockerfile
      args:
        COREPACK_NPM_REGISTRY: ${COREPACK_NPM_REGISTRY:-https://registry.npmjs.org}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    environment:
      WORKWORLD_API_URL: http://api:8000
      WORKWORLD_PUSH_SECRET: ${PUSH_SIGNING_SECRET:-change-me-at-least-32-characters}
      WORKWORLD_AGENT_CREDENTIAL_FILE: /run/workworld-push/credential
      TLS_CERT_FILE: /push-certs/server.crt
      TLS_KEY_FILE: /push-certs/server.key
      PORT: 8443
    volumes:
      - ${WORKWORLD_PUSH_CERT_DIR:-/tmp/workworld-empty-push-certs}:/push-certs:ro
      - ${WORKWORLD_PUSH_RUNTIME_DIR:-/tmp/workworld-empty-push-runtime}:/run/workworld-push:ro
    network_mode: service:minio
    depends_on:
      api: {condition: service_healthy}
      minio: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
